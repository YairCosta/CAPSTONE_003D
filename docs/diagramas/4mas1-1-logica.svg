<text x="650" y="672" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Ninguna persona con sesión lee ni escribe estas tablas: solo el servidor, con funciones que exigen un gerente activo del CRM.</text>
<text x="650" y="694" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Las flechas van del lado «uno» al lado «muchos»: una zona, una etapa o un responsable tienen muchos leads.</text>
<text x="650" y="740" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Reglas en la base, no solo en la app: un lead y su zona son del mismo país y del mismo CRM; los montos se guardan en su moneda, sin convertir; el historial solo se agrega.</text>
<text x="650" y="764" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif">Fuente: supabase/migrations (0001 a 0034) y docs/BASE_DE_DATOS.md</text>
