<text x="64" y="668" font-size="16" font-weight="700" fill="#0F172A" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Reglas de transición</text>
<text x="64" y="700" font-size="13.5" font-weight="700" fill="#4F46E5" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Usuario base:</text>
<text x="196" y="700" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Solo avanza: no puede retroceder ni sacar un lead de Ganado o Perdido.</text>
<text x="64" y="732" font-size="13.5" font-weight="700" fill="#4F46E5" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Gerente:</text>
<text x="196" y="732" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Mueve el lead en cualquier dirección y revierte cambios desde Auditoría.</text>
<text x="64" y="764" font-size="13.5" font-weight="700" fill="#4F46E5" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Automático:</text>
<text x="196" y="764" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Registrar un contacto puede avanzar la etapa. Un lead descartado sale de las métricas de zona.</text>
<text x="64" y="796" font-size="13.5" font-weight="700" fill="#4F46E5" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">Control:</text>
<text x="196" y="796" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif">La regla vive en el guard (sanitizeLeadUpdate + canChangeStage): vale igual para la pantalla y el asistente IA.</text>
